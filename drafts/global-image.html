<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Global Image Test</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <script type="module" src="/scripts/scripts.js"></script>
  </head>
  <body>
    <header></header>
    <main>
      <div>
        <div class="global-image">
          <div>
            <picture>
              <img src="https://placehold.co/720x480/png?text=Global+Image" alt="Global Image example">
            </picture>
          </div>
        </div>
      </div>
      <div>
        <div class="columns panelled">
          <div>
            <div>
              <div class="global-image grid-span-6">
                <div>
                  <picture>
                    <img src="https://placehold.co/720x480/png?text=Half-width+Global+Image" alt="Half-width Global Image example">
                  </picture>
                </div>
              </div>
              <div class="global-text grid-span-6">
                <div><p>Global Image shares the cell with Global Text at 50/50.</p></div>
              </div>
            </div>
            <div><p>The second outer Columns cell remains independent.</p></div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
